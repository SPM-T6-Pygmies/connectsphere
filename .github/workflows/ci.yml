name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration versions are unique
        if: ${{ always() }}
        continue-on-error: false
        run: |
          duplicates=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions (rename one file in each pair):" $duplicates
            exit 1
          fi

      - name: Type check
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm lint

      - name: Tests and registry
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm test:report --check

      - name: Build
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm build

  record:
    name: Record passing tests
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the rebase before pushing has something to rebase onto.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record the run
        run: pnpm test:report --record

      - name: Commit the record
        run: |
          if git diff --quiet docs/tests; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tests
          # [skip ci] keeps this push from retriggering the workflow.
          git commit -m "Record passing tests for ${GITHUB_SHA:0:7} [skip ci]"
          git pull --rebase --autostash
          git push
