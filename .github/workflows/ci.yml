name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration versions are unique
        if: ${{ always() }}
        continue-on-error: false
        run: |
          duplicates=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions (rename one file in each pair):" $duplicates
            exit 1
          fi

      - name: Type check
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm lint

      - name: Tests
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm test

      - name: Build
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm build
