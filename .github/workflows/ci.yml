name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration versions are unique
        if: ${{ always() }}
        continue-on-error: false
        run: |
          duplicates=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions (rename one file in each pair):" $duplicates
            exit 1
          fi

      - name: Type check
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm lint

      - name: Tests and registry
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm test:report --check

      - name: Build
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm build

  record:
    name: Record passing tests
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check the recorder app is configured
        env:
          APP_ID: ${{ vars.RECORD_APP_ID }}
          HAS_KEY: ${{ secrets.RECORD_APP_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error title=Recorder app not configured::Set the RECORD_APP_ID variable and the RECORD_APP_KEY secret. See docs/tests/README.md#recording-runs."
            exit 1
          fi

      # GITHUB_TOKEN cannot push to main: the basic-protection ruleset puts a
      # pull_request rule on it, and GitHub Actions is built into GitHub rather
      # than installed into the org, so it cannot be named as a bypass actor.
      # This app can be, and unlike a personal access token it is nobody's
      # account -- the push is attributable to the app and revocable on its own.
      # The minted token expires in an hour and is scoped to this repo.
      # One-time setup: docs/tests/README.md#recording-runs.
      - name: Mint a token for the recorder app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RECORD_APP_ID }}
          private-key: ${{ secrets.RECORD_APP_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the rebase before pushing has something to rebase onto.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record the run
        run: pnpm test:report --record

      - name: Commit the record
        run: |
          if git diff --quiet docs/tests; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          # Attributed to the app, so the ledger commits are distinguishable
          # from anyone's own work in the history.
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add docs/tests
          # [skip ci] keeps this push from retriggering the workflow.
          git commit -m "Record passing tests for ${GITHUB_SHA:0:7} [skip ci]"
          git pull --rebase --autostash
          git push
