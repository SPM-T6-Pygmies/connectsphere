name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration versions are unique
        if: ${{ always() }}
        continue-on-error: false
        run: |
          duplicates=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions (rename one file in each pair):" $duplicates
            exit 1
          fi

      # The shared project already has every migration on main, and `supabase
      # db push` refuses one dated before the newest it has applied. Catch that
      # here, while the branch is still easy to re-stamp, not at deploy.
      - name: New migrations sort after main's
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: false
        run: |
          git fetch --quiet --depth=1 origin main
          versions() { sed 's#.*/##' | grep '\.sql$' | cut -d_ -f1 | sort -u; }
          on_main=$(git ls-tree --name-only FETCH_HEAD supabase/migrations/ | versions)
          newest=$(echo "$on_main" | tail -1)
          added=$(ls supabase/migrations/*.sql | versions | comm -13 <(echo "$on_main") -)
          stale=$(echo "$added" | awk -v n="$newest" 'NF && $1 <= n')
          if [ -n "$stale" ]; then
            echo "::error::Migrations dated before main's newest ($newest), which supabase db push would refuse. Re-stamp them after it, keeping their order:" $stale
            exit 1
          fi

      - name: Type check
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm lint

      - name: Tests and registry
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm test:report --check

      - name: Build
        if: ${{ always() }}
        continue-on-error: false
        run: pnpm build

  record:
    name: Record passing tests
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    # One recorder at a time, in merge order: two merges close together would
    # otherwise both rewrite the same ledger lines.
    concurrency:
      group: record-registry
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check the recorder app is configured
        env:
          APP_ID: ${{ vars.RECORD_APP_ID }}
          HAS_KEY: ${{ secrets.RECORD_APP_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error title=Recorder app not configured::Set the RECORD_APP_ID variable and the RECORD_APP_KEY secret. See docs/tests/README.md#recording-runs."
            exit 1
          fi

      # GITHUB_TOKEN cannot push to main: the basic-protection ruleset puts a
      # pull_request rule on it, and GitHub Actions is built into GitHub rather
      # than installed into the org, so it cannot be named as a bypass actor.
      # This app can be, and unlike a personal access token it is nobody's
      # account -- the push is attributable to the app and revocable on its own.
      # The minted token expires in an hour and is scoped to this repo.
      # One-time setup: docs/tests/README.md#recording-runs.
      - name: Mint a token for the recorder app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RECORD_APP_ID }}
          private-key: ${{ secrets.RECORD_APP_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the rebase before pushing has something to rebase onto.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app token only has Contents access, so the PR lookup uses the
      # workflow's own token. The commit-to-PR lookup works for squash merges,
      # which leave no "Merge pull request" line to parse.
      - name: Find the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$RUNNER_TEMP/pulls.json"
          echo "number=$(jq -r '.[0].number // empty' "$RUNNER_TEMP/pulls.json")" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.[0].user.login // empty' "$RUNNER_TEMP/pulls.json")" >> "$GITHUB_OUTPUT"
          jq -r '.[0].body // ""' "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/pr-body.md"

      - name: Record the run
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: pnpm test:report --record

      - name: Record the manual results
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: PR_BODY="$(cat "$RUNNER_TEMP/pr-body.md")" pnpm test:report --record-manual

      - name: Commit the record
        run: |
          if git diff --quiet docs/tests; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          # Attributed to the app, so the ledger commits are distinguishable
          # from anyone's own work in the history.
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add docs/tests
          # [skip ci] keeps this push from retriggering the workflow.
          git commit -m "Record passing tests for ${GITHUB_SHA:0:7} [skip ci]"
          # The ledgers are append-only and merge=union (.gitattributes), so a
          # record that landed while this one ran rebases cleanly. Retry in case
          # main moved again between the pull and the push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
          done
          exit 1
